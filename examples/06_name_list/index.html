<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Name List</h1>
    <p>Enter a name and add it to the list.</p>
    <form id="nameForm">
      <input id="nameInput" type="text" placeholder="Enter a name" required>
      <button>Add Name</button>
    </form>
    <p id="message"></p>
    <ul id="nameList"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
