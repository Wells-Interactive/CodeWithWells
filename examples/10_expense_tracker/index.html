<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Tracker</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card"><h1>Expense Tracker</h1>
<form id="expenseForm">
<input id="description" placeholder="What did you buy?" required>
<input id="amount" type="number" min="0" step="0.01" placeholder="Amount" required>
<button>Add Expense</button>
</form>
<h2>Total: ₦<span id="total">0.00</span></h2>
<ul id="expenses"></ul>
</main><script src="script.js"></script></body></html>
