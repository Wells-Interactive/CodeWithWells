<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Generator</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card"><h1>Password Generator</h1>
<label>Length <input id="length" type="number" min="4" max="32" value="12"></label>
<label><input id="numbers" type="checkbox" checked> Include numbers</label>
<label><input id="symbols" type="checkbox" checked> Include symbols</label>
<button id="generate">Generate</button>
<div class="output"><input id="password" readonly><button id="copy">Copy</button></div>
<p id="message"></p></main><script src="script.js"></script></body></html>
